# Sade Factor (Flutter) - test, build Android APK + Windows zip, publish release sade-factor-latest.
name: Build Sade Factor

on:
  push:
    paths:
      - 'sade-factor/**'
      - '.github/workflows/sade-factor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sade-factor-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.1'

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: sade-factor
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/widget_test.dart test/pdf_test.dart

  android:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sade-factor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Collect
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/SadeFactor-android.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: SadeFactor-android
          path: out/SadeFactor-android.apk
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sade-factor
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Bundle with VC++ runtime and zip
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (!(Test-Path "$rel/SadeFactor.exe")) { throw "exe missing" }
          foreach ($d in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            $src = Join-Path $env:WINDIR "System32\$d"
            if (Test-Path $src) { Copy-Item $src $rel }
          }
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          $tmp = "../out/SadeFactor"
          Copy-Item $rel $tmp -Recurse
          Compress-Archive -Path $tmp -DestinationPath ../out/SadeFactor-windows.zip -Force
          Get-ChildItem ../out
      - uses: actions/upload-artifact@v4
        with:
          name: SadeFactor-windows
          path: out/SadeFactor-windows.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove previous release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete sade-factor-latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/sade-factor-latest" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sade-factor-latest
          target_commitish: ${{ github.sha }}
          name: Sade Factor (latest build)
          body: |
            ساده‌فاکتور - نسخه‌ی ۰.۱ (آزمایشی)
            * SadeFactor-android.apk: اندروید ۵ به بالا
            * SadeFactor-windows.zip: ویندوز ۱۰ و ۱۱ (۶۴ بیتی). از حالت فشرده دربیار و SadeFactor.exe رو اجرا کن.
          prerelease: true
          make_latest: false
          files: |
            dist/SadeFactor-android.apk
            dist/SadeFactor-windows.zip
